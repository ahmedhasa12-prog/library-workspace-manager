name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

# Avoid stacking duplicate builds when several commits land in a row.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest  # Windows Server 2022 with Desktop Experience

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'  # LTS version
        # Cache disabled: this repo has no committed lock file.

    - name: Check Node and npm versions
      run: |
        node -v
        npm -v

    - name: Install dependencies
      run: npm install

    - name: Rebuild native modules
      run: npm rebuild better-sqlite3

    # --publish never is baked into the dist:win script so electron-builder
    # does not try to open a GitHub release (which requires GH_TOKEN).
    # GH_TOKEN is provided anyway as a safety net.
    - name: Build Windows installer
      run: npm run dist:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify installer was produced
      shell: pwsh
      run: |
        if (-not (Test-Path 'dist-electron')) {
          Write-Error "dist-electron folder was not created"
          exit 1
        }
        Write-Host "Contents of dist-electron:"
        Get-ChildItem -Path 'dist-electron' -Recurse -File |
          Select-Object -ExpandProperty FullName

        $exe = Get-ChildItem -Path 'dist-electron' -Filter '*.exe' -File -ErrorAction SilentlyContinue
        if (-not $exe) {
          Write-Error "No installer (.exe) found in dist-electron"
          exit 1
        }
        Write-Host "Installer found: $($exe.Name)"

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: library-workspace-manager-installer
        if-no-files-found: error
        path: |
          dist-electron/*.exe
          dist-electron/*.blockmap
        retention-days: 30  # Keep artifacts for 30 days
