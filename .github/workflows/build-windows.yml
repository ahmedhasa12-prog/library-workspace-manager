name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest  # Uses Windows Server 2022 with Desktop Experience
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'  # LTS version
        # Cache disabled to avoid lock file issues
        
    - name: Check Node and npm versions
      run: |
        echo "Node version: $(node -v)"
        echo "npm version: $(npm -v)"
        
    - name: List files
      run: dir
      
    - name: Check for package-lock.json
      run: if exist package-lock.json (echo package-lock.json found) else (echo package-lock.json NOT found)
      
    - name: Check package.json
      run: type package.json
      
    - name: Install dependencies
      run: npm install
      
    - name: Rebuild native modules (if needed)
      run: npm rebuild better-sqlite3 || echo "Rebuild failed or not needed"
      
    - name: Build Windows installer
      run: npm run dist:win
      
    - name: Check if build succeeded
      run: |
        echo Checking dist-electron folder:
        if exist dist-electron (
          dir dist-electron
        ) else (
          echo dist-electron folder not found
        )
        echo Looking for installer:
        for /f %%I in ('dir dist-electron\*.exe /b 2^>nul') do (
          echo Found installer: %%I
          goto :found
        )
        echo No exe files found
        :found
        
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: library-workspace-manager-installer
        path: dist-electron/**/Library Workspace Manager Setup *.exe
        retention-days: 30  # Keep artifacts for 30 days