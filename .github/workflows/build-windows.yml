name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: windows-latest  # Uses Windows Server 2022 with Desktop Experience
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'  # LTS version
        cache: 'npm'
        
    - name: Check Node and npm versions
      run: |
        echo "Node version: $(node -v)"
        echo "npm version: $(npm -v)"
        
    - name: List files
      run: ls -la
      
    - name: Check package.json
      run: cat package.json
      
    - name: Install dependencies
      run: npm ci
      
    - name: Rebuild native modules (if needed)
      run: npm rebuild better-sqlite3 || echo "Rebuild failed or not needed"
      
    - name: Build Windows installer
      run: npm run dist:win
      
    - name: Check if build succeeded
      run: |
        echo "Checking dist-electron folder:"
        ls -la dist-electron/ || echo "dist-electron folder not found"
        echo "Looking for installer:"
        find dist-electron -name "*.exe" -type f || echo "No exe files found"
        
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: library-workspace-manager-installer
        path: dist-electron/**/Library Workspace Manager Setup *.exe
        retention-days: 30  # Keep artifacts for 30 days